name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-render.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-render.txt
          pip install pytest

      - name: Run tests
        env:
          DATA_BACKEND: sqlite
          FLASK_SECRET_KEY: ci-test-key
        run: pytest -q
