<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicPulse — Research Summary</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #3d5a28;
      --ink-deep: #2a3e1c;
      --mint: #e3f0d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Poppins", sans-serif;
      color: var(--ink-deep);
      background: #fff;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.5;
    }
    .summary-header {
      border-bottom: 2px solid var(--ink-deep);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .summary-brand {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .summary-title {
      font-size: 1.6rem;
      font-weight: 600;
      margin: 4px 0;
    }
    .summary-topic {
      font-size: 0.95rem;
      color: #5a6b4a;
    }
    .summary-meta {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 0.82rem;
      color: #7a8a6c;
    }
    .summary-meta strong { color: var(--ink-deep); }
    .summary-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }
    .tag {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 2px 10px;
      border-radius: 6px;
    }
    .tag-cat { background: var(--mint); color: var(--ink-deep); }
    .tag-kw { background: #f0f0ec; color: var(--ink); }

    .section { margin-top: 24px; }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #e4e8dc;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .stat-card {
      padding: 12px 16px;
      border: 1.5px solid #e4e8dc;
      border-radius: 10px;
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #7a8a6c;
      text-transform: capitalize;
    }
    .stat-value {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--ink-deep);
    }

    .signal-item {
      padding: 10px 0;
      border-bottom: 1px solid #eef0ea;
    }
    .signal-item:last-child { border-bottom: none; }
    .signal-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink-deep);
    }
    .signal-body {
      font-size: 0.82rem;
      color: #5a6b4a;
      margin-top: 2px;
      line-height: 1.4;
    }
    .signal-meta {
      font-size: 0.72rem;
      color: #8a9a7c;
      margin-top: 4px;
    }
    .signal-meta .cat {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .notes-text {
      font-size: 0.9rem;
      color: #5a6b4a;
      line-height: 1.5;
    }
    .placeholder-text {
      font-style: italic;
      color: #8a9a7c;
    }

    .jobs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .jobs-table th {
      text-align: left;
      font-weight: 600;
      color: #7a8a6c;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.72rem;
      padding: 6px 8px;
      border-bottom: 1.5px solid #e4e8dc;
    }
    .jobs-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #eef0ea;
    }

    .print-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .print-bar button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 8px 20px;
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      background: var(--ink-deep);
      color: #fff;
      cursor: pointer;
    }
    .print-bar a {
      font-size: 0.85rem;
      color: var(--ink);
      text-decoration: none;
      padding: 8px 0;
    }
    .print-bar a:hover { text-decoration: underline; }

    .footer {
      margin-top: 32px;
      padding-top: 12px;
      border-top: 1px solid #e4e8dc;
      font-size: 0.72rem;
      color: #8a9a7c;
    }

    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 16px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e4e8dc;
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      font-size: 0.88rem;
      color: #7a8a6c;
      font-weight: 500;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { text-align: center; padding: 60px; color: #c55; }

    @media print {
      .print-bar { display: none; }
      body { padding: 20px; }
      .stat-card { border-color: #ccc; }
    }
  </style>
</head>
<body>
  <div class="print-bar" id="printBar">
    <button onclick="window.print()">Print / Save PDF</button>
    <a href="#" id="backLink">&larr; Back to workspace</a>
  </div>
  <div id="summaryContent">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <span class="loading-text">Loading summary...</span>
    </div>
  </div>

  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var id = params.get("id");
    var container = document.getElementById("summaryContent");
    var backLink = document.getElementById("backLink");

    if (backLink) backLink.href = "research-detail.html?id=" + encodeURIComponent(id);

    if (!id) {
      container.innerHTML = '<p class="error">No research ID specified.</p>';
      return;
    }

    function esc(s) {
      var el = document.createElement("span");
      el.textContent = s || "";
      return el.innerHTML;
    }

    function fmtDate(iso) {
      if (!iso) return "";
      try { return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
      catch (e) { return iso; }
    }

    fetch("/api/researches/" + encodeURIComponent(id) + "/summary")
      .then(function (res) {
        if (!res.ok) throw new Error("Not found");
        return res.json();
      })
      .then(function (data) {
        var s = data.summary;
        document.title = "CivicPulse — " + s.title;
        renderSummary(s);
      })
      .catch(function () {
        container.innerHTML = '<p class="error">Failed to load research summary.</p>';
      });

    function renderSummary(s) {
      var cats = (s.categories || []).map(function (c) {
        return '<span class="tag tag-cat">' + esc(c) + '</span>';
      }).join("");
      var kws = (s.keywords || []).map(function (k) {
        return '<span class="tag tag-kw">' + esc(k) + '</span>';
      }).join("");

      var dateRange = "";
      if (s.date_range && s.date_range.earliest) {
        dateRange = fmtDate(s.date_range.earliest);
        if (s.date_range.latest && s.date_range.latest !== s.date_range.earliest) {
          dateRange += " — " + fmtDate(s.date_range.latest);
        }
      }

      // Stats cards
      var statCards = '<div class="stat-card"><div class="stat-value">' + s.hit_count +
        '</div><div class="stat-label">Signals matched</div></div>';

      var byCat = s.by_category || {};
      var catKeys = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });
      catKeys.forEach(function (c) {
        statCards += '<div class="stat-card"><div class="stat-value">' + byCat[c] +
          '</div><div class="stat-label">' + esc(c) + '</div></div>';
      });

      // Top signals
      var signalsHtml = "";
      (s.top_signals || []).forEach(function (sig) {
        var sigCats = (sig.categories || []).map(function (c) {
          return '<span class="cat">' + esc(c) + '</span>';
        }).join(", ");
        var body = sig.body && sig.body !== sig.title
          ? '<div class="signal-body">' + esc(sig.body) + (sig.body.length >= 300 ? "..." : "") + '</div>'
          : '';
        signalsHtml += '<div class="signal-item">' +
          '<div class="signal-title">' + esc(sig.title || "(no title)") + '</div>' +
          body +
          '<div class="signal-meta">' +
          (sig.source ? esc(sig.source.toUpperCase()) : "") +
          (sigCats ? ' &middot; ' + sigCats : '') +
          (sig.published_utc ? ' &middot; ' + fmtDate(sig.published_utc) : '') +
          '</div></div>';
      });

      // Jobs table
      var jobsHtml = "";
      if (s.jobs && s.jobs.length) {
        var rows = s.jobs.map(function (j) {
          return '<tr><td>' + esc(j.source) + '</td><td>' + esc(j.status) + '</td><td>' +
            fmtDate(j.created_at) + '</td></tr>';
        }).join("");
        jobsHtml = '<div class="section"><div class="section-title">Data collection jobs</div>' +
          '<table class="jobs-table"><thead><tr><th>Source</th><th>Status</th><th>Date</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table></div>';
      }

      // Notes
      var notesHtml = "";
      if (s.notes) {
        notesHtml = '<div class="section"><div class="section-title">Notes</div>' +
          '<p class="notes-text">' + esc(s.notes) + '</p></div>';
      }

      // Extract-flag sections
      var extractLabels = {
        sentiment: "Sentiment & emotion",
        clustering: "Narrative clustering",
        demographics: "Voice demographics",
        policy: "Policy asks",
        misinfo: "Misinformation flags",
        bots: "Bot & brigading detection",
      };
      var extractHtml = "";
      var extractFlags = s.extract || [];
      if (extractFlags.length) {
        extractFlags.forEach(function (flag) {
          var label = extractLabels[flag] || flag;
          extractHtml += '<div class="section"><div class="section-title">' + esc(label) + '</div>' +
            '<p class="notes-text placeholder-text">Analysis pending — will be populated when data collection completes.</p></div>';
        });
      }

      container.innerHTML =
        '<div class="summary-header">' +
        '<div class="summary-brand">CivicPulse Research Summary</div>' +
        '<h1 class="summary-title">' + esc(s.title) + '</h1>' +
        (s.topic ? '<p class="summary-topic">' + esc(s.topic) + '</p>' : '') +
        '<div class="summary-meta">' +
        '<span>Status: <strong>' + esc(s.status) + '</strong></span>' +
        '<span>Signals: <strong>' + s.hit_count + '</strong></span>' +
        (dateRange ? '<span>Period: <strong>' + dateRange + '</strong></span>' : '') +
        '<span>Created: <strong>' + fmtDate(s.created_at) + '</strong></span>' +
        '</div>' +
        (cats || kws ? '<div class="summary-tags">' + cats + kws + '</div>' : '') +
        '</div>' +

        '<div class="section"><div class="section-title">Overview</div>' +
        '<div class="stats-grid">' + statCards + '</div></div>' +

        (signalsHtml ? '<div class="section"><div class="section-title">Top signals</div>' +
          signalsHtml + '</div>' : '') +

        extractHtml + jobsHtml + notesHtml +

        '<div class="footer">Generated ' + new Date().toLocaleDateString(undefined, {
          year: "numeric", month: "long", day: "numeric"
        }) + ' &middot; CivicPulse</div>';
    }
  })();
  </script>
</body>
</html>
